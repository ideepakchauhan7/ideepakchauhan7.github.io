name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      
      - name: Build site locally
        run: npm ci && npm run build
      
      - name: Copy built files to root
        run: |
          # Remove old files from root (except .git and .github)
          find . -maxdepth 1 -type f -not -name '.gitignore' -delete
          find . -maxdepth 1 -type d -not -name '.git' -not -name '.github' -not -name 'node_modules' -not -name '.next' -not -name 'out' -exec rm -rf {} + 2>/dev/null || true
          
          # Copy all files from out/ to root
          cp -r out/* .
          
          # Remove unnecessary directories
          rm -rf out .next node_modules
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit and push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Deploy: update portfolio site"
            git push
          else
            echo "No changes to commit"
          fi
