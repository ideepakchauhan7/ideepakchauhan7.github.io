name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./artifact
      
      - name: Extract and deploy
        run: |
          mkdir -p ./pages
          cd ./artifact
          tar -xf artifact.tar
          cd ..
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: Clean and copy files
        run: |
          # Remove all files except .git and .github
          find . -maxdepth 1 -type f ! -name '.gitignore' -delete
          find . -maxdepth 1 -type d ! -name '.git' ! -name '.github' ! -name 'artifact' -exec rm -rf {} + 2>/dev/null || true
          
          # Copy built files from artifact
          cp -r ./artifact/* .
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Deploy: update portfolio site" && git push)
